[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hardening-audit"
version = "0.1.0"
description = "Read-only Linux hardening audit (SSH, accounts, sysctl, permissions, packages) that generates an Ansible remediation playbook"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
hardening-audit = "hardening_audit.cli:main"

[tool.setuptools]
packages = ["hardening_audit"]
